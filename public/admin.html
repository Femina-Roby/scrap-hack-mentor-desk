<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer · Mentor Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Sora:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔩</text></svg>">
<style>
  body{background:var(--bg-soft);font-size:15px;}
  .top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2.5px solid var(--outline);}
  .top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
  .brand{font-family:"Baloo 2";font-weight:800;font-size:1.5rem;color:var(--blue);line-height:1;}
  .brand small{font-family:"Space Mono";font-size:.62rem;letter-spacing:.14em;color:var(--orange-deep);display:block;text-transform:uppercase;}
  .nav{display:flex;gap:6px;}
  .nav a{padding:8px 16px;border-radius:999px;font-weight:700;text-decoration:none;color:var(--ink-soft);border:2px solid transparent;}
  .nav a.on{color:var(--ink);border-color:var(--outline);background:var(--orange-tint);}
  .spacer{flex:1;}
  .wrap{max-width:1320px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:22px;}
  h1.display{font-size:2.2rem;}
  h2{font-family:"Baloo 2";font-weight:800;font-size:1.35rem;line-height:1.1;}
  .grid{display:grid;gap:22px;}
  .g2{grid-template-columns:1.1fr .9fr;}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:980px){.g2,.g4{grid-template-columns:1fr;}}
  .round{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:2.5px solid var(--outline);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:3px 3px 0 var(--outline);}
  .round:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--outline);}
  .round.live{background:var(--orange);color:#fff;}
  .round.live .eyebrow{color:#fff;}
  .round .t{font-weight:800;font-size:1.1rem;}
  .round .bar{color:inherit;height:10px;margin-top:6px;}
  .round.live .bar > i{background:#fff;}
  table{width:100%;border-collapse:collapse;background:#fff;}
  th{font-family:"Space Mono";font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:10px;border-bottom:2px solid var(--outline);white-space:nowrap;}
  td{padding:10px;border-bottom:1.5px solid var(--line);vertical-align:top;}
  tr.cut td{border-bottom:3px dashed var(--orange);}
  tr.click{cursor:pointer;}
  tr.click:hover td{background:var(--blue-tint);}
  .tablecard{background:#fff;border:2.5px solid var(--outline);border-radius:18px;overflow:auto;box-shadow:var(--shadow-hard);}
  .att{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1.5px solid var(--line);}
  .att:last-child{border-bottom:0;}
  .star{all:unset;cursor:pointer;font-size:1.3rem;line-height:1;color:var(--ink-faint);}
  .star.on{color:var(--orange);}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .tl{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;overflow-x:auto;}
  .tl .card{display:flex;flex-direction:column;gap:8px;font-size:.92rem;}
  .kv b{display:block;font-family:"Space Mono";font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;}
  .greycard{background:var(--line);border-radius:12px;padding:8px 10px;font-size:.82rem;color:var(--ink-soft);}
  .tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--blue-tint);color:var(--blue-deep);margin:2px 4px 2px 0;}
  .drop{border:2.5px dashed var(--ink-faint);border-radius:18px;padding:28px;text-align:center;background:#fff;cursor:pointer;}
  .drop.over{border-color:var(--blue);background:var(--blue-tint);}
  .stat{display:flex;flex-direction:column;}
  .stat b{font-family:"Baloo 2";font-size:2rem;line-height:1;}
  .row-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .input.sm{padding:8px 12px;min-height:0;font-size:.92rem;border-radius:10px;}
  .gate{max-width:420px;margin:12vh auto;display:flex;flex-direction:column;gap:16px;padding:0 16px;}
  .sel-sm{padding:6px 8px;border-radius:8px;border:2px solid var(--outline);font-size:.85rem;background:#fff;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0 18px;}
  .tile{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;}
  .tile .v{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2rem;line-height:1.1;color:var(--ink);}
  .tile .k{font-size:.8rem;color:var(--ink-soft);}
  .tile .s{font-size:.75rem;color:var(--ink-faint);}
  .mbar{display:block;height:6px;border-radius:4px;background:var(--blue);margin-top:4px;min-width:2px;}
  .rn{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .nav{max-width:100%;overflow-x:auto;scrollbar-width:none;}
  .nav a{flex-shrink:0;}
  .att{flex-wrap:wrap;min-width:0;}
  .att select{max-width:100%;}
  .grid>*{min-width:0;}
</style>
</head>
<body>
<header class="top" id="top" hidden><div class="top-in">
  <div class="brand">Mentor Desk<small>Organizer</small></div>
  <nav class="nav">
    <a href="#/live" data-p="live">Live</a>
    <a href="#/finalists" data-p="finalists">Finalists</a>
    <a href="#/scores" data-p="scores">Scores</a>
    <a href="#/mentors" data-p="mentors">Mentors</a>
    <a href="#/teams" data-p="teams">Teams</a>
    <a href="#/setup" data-p="setup">Setup</a>
  </nav>
  <div class="spacer"></div>
  <span class="small muted" id="updated"></span>
</div></header>
<main class="wrap" id="main"></main>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
